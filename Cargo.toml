[package]
name = "t0-gpu"
version = "0.1.1"
edition = "2021"
description = "T0 — RDNA3 裸金属 GPU 内核编译器 & KFD 运行时"
authors = ["GeisYaO <q1179671016@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/clearnature/rust-gpu"

[workspace]  # Keep as standalone crate

[features]
default = []
rocm = []                          # Enable KFD runtime (requires /dev/kfd)
monitor = ["dep:ratatui", "dep:crossterm", "dep:tokio"]  # GPU monitoring TUI

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
libc = "0.2"

[[bin]]
name = "t0"
path = "src/bin/t0.rs"

[[bin]]
name = "isa_probe"
path = "src/bin/isa_probe.rs"

[[bin]]
name = "gpu_monitor"
path = "src/bin/gpu_monitor.rs"
required-features = ["monitor"]
